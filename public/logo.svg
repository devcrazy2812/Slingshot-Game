<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="60%" stop-color="#05070f"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>

    <!-- Singularity Accretion Disk Glow -->
    <radialGradient id="accretionGrad" cx="42%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="38%" stop-color="#030712"/>
      <stop offset="42%" stop-color="#f59e0b"/>
      <stop offset="48%" stop-color="#ec4899"/>
      <stop offset="62%" stop-color="#00f7ff"/>
      <stop offset="85%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- Slingshot Trajectory Beam -->
    <linearGradient id="slingshotArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00f7ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Vessel Hull Metallic Gradient -->
    <linearGradient id="hullMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Thruster Plasma Flame -->
    <linearGradient id="plasmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f7ff"/>
      <stop offset="80%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Shield Base -->
  <rect width="512" height="512" rx="104" fill="url(#spaceGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="101" fill="none" stroke="rgba(0, 247, 255, 0.22)" stroke-width="2.5"/>

  <!-- Tactical Hex-Guidance Frame -->
  <polygon points="256,36 448,146 448,366 256,476 64,366 64,146" 
           fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.8" stroke-dasharray="14 10"/>

  <!-- Orbital Relativistic Coordinate Grid Rings -->
  <circle cx="230" cy="265" r="185" fill="none" stroke="rgba(0, 247, 255, 0.12)" stroke-width="1.2" stroke-dasharray="6 6"/>
  <circle cx="230" cy="265" r="140" fill="none" stroke="rgba(192, 132, 252, 0.18)" stroke-width="1.2"/>

  <!-- Gargantua Event Horizon Gravitational Singularity Accretion Disk -->
  <ellipse cx="230" cy="265" rx="155" ry="92" fill="url(#accretionGrad)" 
           transform="rotate(-26 230 265)" filter="url(#intenseGlow)"/>

  <!-- The Black Hole Singularity Shadow (Photon Sphere) -->
  <circle cx="230" cy="265" r="46" fill="#000000"/>
  <circle cx="230" cy="265" r="47.5" fill="none" stroke="#fbbf24" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Hyperbolic Relativistic Slingshot Arc Trail -->
  <path d="M 70 410 C 130 380, 190 320, 230 205 C 248 150, 285 105, 385 75" 
        fill="none" stroke="url(#slingshotArcGrad)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)"/>
  
  <path d="M 70 410 C 130 380, 190 320, 230 205 C 248 150, 285 105, 385 75" 
        fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Dual Quantum Ion Ribbons -->
  <path d="M 95 425 C 150 395, 205 340, 242 225 C 258 175, 295 125, 395 95" 
        fill="none" stroke="rgba(0, 247, 255, 0.5)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- High-Tech Vanguard Stealth Interceptor (Escaping Singularity) -->
  <g transform="translate(385, 75) rotate(32)">
    <!-- Plasma Thruster Flare -->
    <polygon points="-28,0 -8,-7 -12,0 -8,7" fill="url(#plasmaGrad)" filter="url(#neonGlow)"/>
    
    <!-- Forward-Swept Hull Geometry -->
    <!-- Port Wing -->
    <polygon points="26,0 -4,-18 -16,-24 -10,-8 0,0" fill="url(#hullMetal)" stroke="#00f7ff" stroke-width="1.5"/>
    <!-- Starboard Wing -->
    <polygon points="26,0 -4,18 -16,24 -10,8 0,0" fill="url(#hullMetal)" stroke="#00f7ff" stroke-width="1.5"/>
    <!-- Fuselage Spine -->
    <polygon points="30,0 -16,-7 -20,0 -16,7" fill="#f8fafc" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Cockpit Canopy & Quantum Singularity Drive Core -->
    <polygon points="12,0 -2,-4 -4,0 -2,4" fill="#00f7ff" filter="url(#neonGlow)"/>
    <circle cx="2" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Relativistic Velocity Sparks / Photon Emitters -->
  <circle cx="430" cy="58" r="3" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="360" cy="85" r="2" fill="#00f7ff" filter="url(#neonGlow)"/>
  <circle cx="280" cy="125" r="2.5" fill="#fbbf24"/>
  <circle cx="160" cy="345" r="2" fill="#c084fc"/>

  <!-- High-Precision HUD Coordinate Ticks -->
  <line x1="256" y1="20" x2="256" y2="32" stroke="#00f7ff" stroke-width="2.5"/>
  <line x1="256" y1="480" x2="256" y2="492" stroke="#00f7ff" stroke-width="2.5"/>
  <line x1="20" y1="256" x2="32" y2="256" stroke="#00f7ff" stroke-width="2.5"/>
  <line x1="480" y1="256" x2="492" y2="256" stroke="#00f7ff" stroke-width="2.5"/>
</svg>
